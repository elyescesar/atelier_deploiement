name: Full DevOps Pipeline

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      action:
        description: Pipeline action
        required: true
        default: deploy
        type: choice
        options:
          - deploy
          - destroy
          - cleanup

jobs:
  cleanup:
    name: Cleanup Orphaned Lab Resources
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Run lab cleanup script
        run: bash scripts/cleanup-lab.sh

  terraform:
    name: Provision Infrastructure
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}
      TF_IN_AUTOMATION: true
    outputs:
      instance_ips: ${{ steps.export.outputs.instance_ips }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Download Terraform State
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: terraform-state
          path: terraform

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Cleanup orphaned lab resources
        continue-on-error: true
        timeout-minutes: 15
        run: |
          if terraform state show aws_vpc.main >/dev/null 2>&1; then
            echo "VPC already in Terraform state, skipping orphan cleanup"
            exit 0
          fi
          bash ../scripts/cleanup-lab.sh

      - name: Cleanup orphaned load balancers
        continue-on-error: true
        timeout-minutes: 10
        run: |
          set +e
          if terraform state show aws_lb.main >/dev/null 2>&1; then
            echo "ALB tracked in state, skipping orphan cleanup"
            exit 0
          fi

          for ALB_NAME in ecommerce-devops-lab-alb; do
            ALB_ARN=$(aws elbv2 describe-load-balancers --names "$ALB_NAME" --query 'LoadBalancers[0].LoadBalancerArn' --output text 2>/dev/null || true)
            if [ -z "$ALB_ARN" ] || [ "$ALB_ARN" = "None" ]; then
              continue
            fi
            for LISTENER_ARN in $(aws elbv2 describe-listeners --load-balancer-arn "$ALB_ARN" --query 'Listeners[].ListenerArn' --output text 2>/dev/null); do
              aws elbv2 delete-listener --listener-arn "$LISTENER_ARN"
            done
            aws elbv2 delete-load-balancer --load-balancer-arn "$ALB_ARN"
            aws elbv2 wait load-balancers-deleted --load-balancer-arns "$ALB_ARN" 2>/dev/null || sleep 60
          done

          for TG_NAME in ecommerce-devops-lab-tg; do
            TG_ARN=$(aws elbv2 describe-target-groups --names "$TG_NAME" --query 'TargetGroups[0].TargetGroupArn' --output text 2>/dev/null || true)
            if [ -n "$TG_ARN" ] && [ "$TG_ARN" != "None" ]; then
              aws elbv2 delete-target-group --target-group-arn "$TG_ARN"
            fi
          done

      - name: Terraform Plan
        run: terraform plan -out=tfplan -var="key_name=${{ secrets.EC2_KEY_NAME }}"

      - name: Terraform Apply
        id: terraform-apply
        run: terraform apply -auto-approve tfplan

      - name: Export Instance IPs
        id: export
        run: |
          IPS=$(terraform output -json instance_public_ips | jq -r '.[]' | tr '\n' ',' | sed 's/,$//')
          echo "instance_ips=$IPS" >> $GITHUB_OUTPUT

      - name: Upload Terraform State
        if: always() && (steps.terraform-apply.outcome == 'success' || steps.terraform-apply.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          retention-days: 30
          if-no-files-found: ignore

  ansible:
    name: Configure Servers
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'deploy')
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible jq

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_KEY }}" > key.pem
          chmod 600 key.pem

      - name: Generate Inventory
        run: |
          echo "[web]" > inventory.ini
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            echo "$ip ansible_user=ec2-user ansible_ssh_private_key_file=key.pem" >> inventory.ini
          done
          cat inventory.ini

      - name: Wait for SSH on instances
        run: |
          for ip in $(echo "${{ needs.terraform.outputs.instance_ips }}" | tr ',' ' '); do
            for i in $(seq 1 30); do
              if ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5 -i key.pem ec2-user@"$ip" "echo ready" 2>/dev/null; then
                break
              fi
              sleep 10
            done
          done

      - name: Build and export container images on runner
        run: |
          docker pull public.ecr.aws/docker/library/mongo:6.0
          docker build -t ecommerce-nginx:latest docker/nginx
          docker save public.ecr.aws/docker/library/mongo:6.0 ecommerce-nginx:latest -o lab-images.tar

      - name: Run Ansible Deployment
        run: ansible-playbook -i inventory.ini ansible/deploy.yml
        env:
          ANSIBLE_HOST_KEY_CHECKING: "False"

  destroy:
    name: Destroy Infrastructure (Manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      TF_VAR_key_name: ${{ secrets.EC2_KEY_NAME }}
      TF_IN_AUTOMATION: true
    steps:
      - uses: actions/checkout@v4

      - name: Download Terraform State
        uses: actions/download-artifact@v4
        with:
          name: terraform-state
          path: terraform

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Destroy
        run: terraform destroy -auto-approve -input=false

      - name: Upload Terraform State
        uses: actions/upload-artifact@v4
        with:
          name: terraform-state
          path: terraform/terraform.tfstate
          retention-days: 30
          if-no-files-found: ignore
