<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="bg"></div>
  <header class="header">
    <div class="brand">
      <span class="logo">◆</span>
      <div>
        <h1>E-Commerce Store</h1>
      </div>
    </div>
    <button type="button" class="btn btn-primary" id="btn-new">+ Add product</button>
  </header>

  <main class="container">
    <section class="panel form-panel hidden" id="form-panel">
      <h2 id="form-title">Add product</h2>
      <form id="product-form" class="form">
        <input type="hidden" id="product-id">
        <label>
          Name
          <input type="text" id="name" required placeholder="Laptop">
        </label>
        <label>
          Price ($)
          <input type="number" id="price" required min="0" step="0.01" placeholder="1200">
        </label>
        <label>
          Category
          <input type="text" id="category" placeholder="Electronics">
        </label>
        <label>
          Description
          <textarea id="description" rows="3" placeholder="Short description"></textarea>
        </label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Save</button>
          <button type="button" class="btn btn-ghost" id="btn-cancel">Cancel</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Catalog</h2>
        <span class="badge" id="product-count">0 items</span>
      </div>
      <div id="products" class="grid"></div>
      <p id="empty-state" class="empty hidden">No products yet. Add one to get started.</p>
    </section>
  </main>

  <template id="card-template">
    <article class="card">
      <div class="card-top">
        <span class="tag"></span>
        <div class="card-actions">
          <button type="button" class="icon-btn edit" title="Edit">✎</button>
          <button type="button" class="icon-btn delete" title="Delete">✕</button>
        </div>
      </div>
      <h3 class="card-title"></h3>
      <p class="card-desc"></p>
      <p class="card-price"></p>
    </article>
  </template>

  <script src="/app.js"></script>
</body>
</html>
